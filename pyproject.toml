[project]
name = "minigeom"
version = "0.10.0"
description = "Backend-independent analytical CSG geometry builder with modular volume archives and OpenMC/TRIPOLI-5 exporters"
readme = "README.md"
authors = [
    { name = "Louis DROUARD" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.4",
]

[project.optional-dependencies]
mesh = ["trimesh>=4.0"]
mesh-boolean = ["trimesh>=4.0", "manifold3d"]
view = ["trimesh>=4.0", "manifold3d", "pyvista"]
test = ["pytest", "trimesh>=4.0", "manifold3d"]
dev = ["pytest", "trimesh>=4.0", "manifold3d", "pyvista"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"


[project]
name = "minigeom"
version = "0.1.0"
description = "Analytical hierarchical CSG geometry builder with OpenMC and TRIPOLI-5 exporters"
readme = "README.md"
authors = [
    { name = "Louis DROUARD" }
]
requires-python = ">=3.12"
dependencies = [
    "manifold3d>=3.5.5",
    "numpy>=1.26.4",
    "trimesh>=4.0",
]

[project.scripts]
minigeom = "minigeom:main"

[project.optional-dependencies]
view = [
    "pyvista>=0.49.2",
]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

